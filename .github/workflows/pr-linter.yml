name: PR - Linter
on: pull_request
jobs:
  phpcs:
    name: PHP CodeSniffer (PHP ${{ matrix.php }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # v2.34.1
        with:
          php-version: ${{ matrix.php }}
          tools: phpcs, cs2pr
      - name: Tool versions
        run: |
          php --version
          phpcs --version
      - name: Run PHP CodeSniffer
        continue-on-error: true
        run: phpcs --standard=phpcs.xml --report-checkstyle=./phpcs-report.xml
      - name: Show PHPCS results in PR
        run: cs2pr ./phpcs-report.xml