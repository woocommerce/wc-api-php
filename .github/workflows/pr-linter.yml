name: PR - Linter
on: pull_request
jobs:
  phpcs:
    name: PHP CodeSniffer (PHP ${{ matrix.php }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1"]
    steps:
      - name: Checkout code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: phpcs, cs2pr
      - name: Tool versions
        run: |
          php --version
          phpcs --version
      - name: Run PHP CodeSniffer
        continue-on-error: true
        run: phpcs --standard=phpcs.xml --report-checkstyle=./phpcs-report.xml
      - name: Show PHPCS results in PR
        run: cs2pr ./phpcs-report.xml